[package]
name = "lyre"
version = "0.1.7"
edition = "2021"
description = "Lyre - a terminal music player for Spotify and YouTube Music"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
